<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bhagwa Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff6a00, #ffb347);
    overflow: hidden;
  }

  /* glowing background circles */
  body::before, body::after {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    animation: float 8s infinite ease-in-out;
  }

  body::after {
    top: 60%;
    left: 70%;
    animation-delay: 3s;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-40px); }
  }

  .login-container {
    position: relative;
    z-index: 1;
    width: 350px;
    padding: 35px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    color: white;
    text-align: center;
  }

  .login-container h2 {
    margin-bottom: 25px;
    letter-spacing: 1px;
  }

  .input-group {
    margin-bottom: 18px;
    text-align: left;
  }

  .input-group label {
    font-size: 13px;
    opacity: 0.9;
  }

  .input-group input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: none;
    border-radius: 6px;
    outline: none;
  }

  .input-group input:focus {
    box-shadow: 0 0 8px rgba(255,255,255,0.6);
  }

  .login-btn {
    width: 100%;
    padding: 10px;
    background: #ff6a00;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  .login-btn:hover {
    background: #e65c00;
    transform: scale(1.05);
  }

  .extra {
    margin-top: 15px;
    font-size: 13px;
  }

  .extra a {
    color: #fff;
    text-decoration: underline;
  }

</style>
</head>

<body>

<div class="login-container">
  <h2>🚩 Welcome Back</h2>

  <form>
    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Enter email" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Enter password" required>
    </div>

    <button class="login-btn">Login</button>
  </form>

  <div class="extra">
    <p>New user? <a href="#">Create account</a></p>
  </div>
</div>

</body>
</html>
